name: Build Firmware

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: toolchain
          key: ${{ runner.os }}-toolchain-${{ hashFiles('scripts/toolchain/fbtenv.sh') }}

      - name: Build firmware
        run: ./fbt COMPACT=1 DEBUG=0 FBT_NO_SYNC=1 fw_dist

      - name: Build FAPs
        run: ./fbt COMPACT=1 DEBUG=0 FBT_NO_SYNC=1 fap_dist

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: dist/f7-C/
          retention-days: 30
