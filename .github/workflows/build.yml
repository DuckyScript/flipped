name: Build Firmware

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FBT_NO_SYNC: 1
      FBT_GIT_SUBMODULE_SHALLOW: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: toolchain
          key: ${{ runner.os }}-toolchain-v39-${{ runner.arch }}

      - name: Build firmware
        run: ./fbt COMPACT=1 DEBUG=0 fw_dist

      - name: Build FAPs
        run: ./fbt COMPACT=1 DEBUG=0 fap_dist

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: dist/f7-C/
          retention-days: 30
