name: Lint & Format Check

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      FBT_NO_SYNC: 1
      FBT_GIT_SUBMODULE_SHALLOW: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: toolchain
          key: ${{ runner.os }}-toolchain-v39-${{ runner.arch }}

      - name: Lint C code
        run: ./fbt lint

      - name: Lint Python code
        run: ./fbt lint_py

      - name: Lint image assets
        run: ./fbt lint_img
