name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: toolchain
          key: ${{ runner.os }}-toolchain-${{ hashFiles('scripts/toolchain/fbtenv.sh') }}

      - name: Build firmware
        run: ./fbt COMPACT=1 DEBUG=0 FBT_NO_SYNC=1 updater_package

      - name: Build FAPs
        run: ./fbt COMPACT=1 DEBUG=0 FBT_NO_SYNC=1 fap_dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/f7-C/*.dfu
            dist/f7-C/*.bin
            dist/f7-C/*.tgz
            dist/f7-C/*.zip
